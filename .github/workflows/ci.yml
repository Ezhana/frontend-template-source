name: CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24.21.0
          cache: true
          require-lockfile: true

      - name: Check environment
        run: |
          node --version
          pnpm --version

      - name: Check create-app version manifest
        run: |
          pnpm sync:create-app
          git diff --exit-code -- tools/create-app/versions.json

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
