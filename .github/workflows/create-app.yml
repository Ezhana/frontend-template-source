name: Create app matrix

on:
  workflow_dispatch:

  push:
    paths:
      - 'tools/create-app/**'
      - 'template/**'
      - 'scripts/export-template.mjs'
      - 'packages/**'
      - 'pnpm-workspace.yaml'

  pull_request:
    paths:
      - 'tools/create-app/**'
      - 'template/**'
      - 'scripts/export-template.mjs'
      - 'packages/**'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: create-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create:
    name: Create ${{ matrix.template }} app
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - template: react
            features: ''
          - template: vue
            features: ''
          - template: react
            features: '--eslint --prettier'
          - template: vue
            features: '--eslint --prettier'
          - template: react
            features: '--no-theme'
          - template: vue
            features: '--no-theme --eslint --prettier'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24.21.0
          cache: true
          require-lockfile: true

      # Generate inside the workspace: with --eslint/--prettier the app depends on the @ezhana
      # config packages shipped in packages/ through workspace:* dependencies, so it cannot live
      # outside the pnpm workspace.
      - name: Generate app
        run: pnpm create:app ${{ matrix.template }} generated-app ${{ matrix.features }}

      - name: Check default generated files
        if: matrix.features == ''
        run: |
          test -f apps/generated-app/src/theme/registry.ts
          test -f apps/generated-app/src/theme/useTheme.ts
          test ! -f apps/generated-app/eslint.config.mjs
          test ! -f apps/generated-app/prettier.config.mjs
          if [ "${{ matrix.template }}" = "react" ]; then
            test -f apps/generated-app/.oxlintrc.json
          fi

      - name: Check configured generated files
        if: contains(matrix.features, '--eslint')
        run: |
          test -f apps/generated-app/eslint.config.mjs
          test -f apps/generated-app/prettier.config.mjs
          test -f apps/generated-app/.prettierignore
          if [ "${{ contains(matrix.features, '--no-theme') }}" != "true" ]; then
            test -f apps/generated-app/src/theme/registry.ts
            test -f apps/generated-app/src/theme/useTheme.ts
          fi
          grep -q "@ezhana/eslint-config-${{ matrix.template }}" apps/generated-app/eslint.config.mjs
          grep -q '@ezhana/prettier-config' apps/generated-app/prettier.config.mjs
          grep -q '"@ezhana/eslint-config-${{ matrix.template }}": "workspace:' apps/generated-app/package.json
          grep -q '"@ezhana/prettier-config": "workspace:' apps/generated-app/package.json

      # --no-theme is the escape hatch: no overlay files, no theme init script, no @ezhana theme
      # dependencies (the optional lint/format config packages are still allowed).
      - name: Check no-theme generated files
        if: contains(matrix.features, '--no-theme')
        run: |
          test ! -e apps/generated-app/src/theme
          if grep -q 'ezhana-theme' apps/generated-app/index.html; then
            echo 'index.html still contains the theme init script'
            exit 1
          fi
          if grep -Eq '"@ezhana/(design-tokens|theme|design-theme-)' apps/generated-app/package.json; then
            echo 'the app still depends on @ezhana theme packages'
            exit 1
          fi

      - name: Pack generator
        run: |
          pnpm --dir tools/create-app pack --pack-destination "$RUNNER_TEMP"
          tarball=$(ls "$RUNNER_TEMP"/create-ezhana-app-*.tgz)
          tar -tzf "$tarball" | grep -qx 'package/bin/create-app.mjs'
          tar -tzf "$tarball" | grep -qx 'package/overlays/react/src/ThemeRoot.tsx'
          tar -tzf "$tarball" | grep -qx 'package/overlays/react/src/theme/registry.ts'
          tar -tzf "$tarball" | grep -qx 'package/overlays/vue/src/theme/registry.ts'
          tar -tzf "$tarball" | grep -qx 'package/overlays/vue/src/ThemeRoot.vue'
          tar -tzf "$tarball" | grep -qx 'package/recipes/index.mjs'
          tar -tzf "$tarball" | grep -qx 'package/snippets/theme-init.html'
          tar -tzf "$tarball" | grep -qx 'package/templates/eslint-react.config.mjs'
          tar -tzf "$tarball" | grep -qx 'package/templates/eslint-vue.config.mjs'
          tar -tzf "$tarball" | grep -qx 'package/templates/prettier.config.mjs'
          tar -tzf "$tarball" | grep -qx 'package/templates/prettierignore'
          tar -tzf "$tarball" | grep -qx 'package/versions.json'
