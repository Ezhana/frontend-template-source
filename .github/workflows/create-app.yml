name: Create app matrix

on:
  workflow_dispatch:

  push:
    paths:
      - 'tools/create-app/**'
      - 'template/**'
      - 'scripts/export-template.mjs'
      - 'packages/**'
      - 'pnpm-workspace.yaml'

  pull_request:
    paths:
      - 'tools/create-app/**'
      - 'template/**'
      - 'scripts/export-template.mjs'
      - 'packages/**'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: create-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create:
    name: Create ${{ matrix.framework }} app
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: next
            lint_package: next
            features: '--defaults'
          - framework: vue
            lint_package: vue
            features: '--defaults'
          - framework: astro
            lint_package: astro
            features: '--defaults'
          - framework: nuxt
            lint_package: nuxt
            features: '--defaults'
          - framework: sveltekit
            lint_package: svelte
            features: '--defaults'
          - framework: next
            lint_package: next
            features: '--defaults --eslint --prettier'
          - framework: vue
            lint_package: vue
            features: '--defaults --eslint --prettier'
          - framework: astro
            lint_package: astro
            features: '--defaults --eslint --prettier'
          - framework: nuxt
            lint_package: nuxt
            features: '--defaults --eslint --prettier'
          - framework: sveltekit
            lint_package: svelte
            features: '--defaults --eslint --prettier'
          - framework: next
            lint_package: next
            features: '--defaults --theme ocean'
          - framework: vue
            lint_package: vue
            features: '--defaults --theme cerulean'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24.21.0
          cache: true
          require-lockfile: true

      # Generate inside the workspace: with --eslint/--prettier the app depends on the @ezhana
      # config packages shipped in packages/ through workspace:* dependencies, so it cannot live
      # outside the pnpm workspace.
      - name: Generate app
        run: pnpm create:app ${{ matrix.framework }} generated-app ${{ matrix.features }}

      - name: Check generated app
        run: |
          test -f apps/generated-app/package.json
          test -f apps/generated-app/README.md

      - name: Check configured generated files
        if: contains(matrix.features, '--eslint')
        run: |
          test -f apps/generated-app/eslint.config.mjs
          test -f apps/generated-app/prettier.config.mjs
          test -f apps/generated-app/.prettierignore
          grep -q "@ezhana/eslint-config-${{ matrix.lint_package }}" apps/generated-app/eslint.config.mjs
          grep -q '@ezhana/prettier-config' apps/generated-app/prettier.config.mjs
          grep -q '"@ezhana/eslint-config-${{ matrix.lint_package }}": "workspace:' apps/generated-app/package.json
          grep -q '"@ezhana/prettier-config": "workspace:' apps/generated-app/package.json

      - name: Check injected theme
        if: contains(matrix.features, '--theme')
        run: |
          grep -q '"@ezhana/design-theme-' apps/generated-app/package.json
          grep -R -q "@ezhana/design-theme-" apps/generated-app/src --include='*.css'

      - name: Pack generator
        run: |
          pnpm --dir tools/create-app pack --pack-destination "$RUNNER_TEMP"
          tarball=$(ls "$RUNNER_TEMP"/create-ezhana-app-*.tgz)
          tar -tzf "$tarball" | grep -qx 'package/bin/create-app.mjs'
          tar -tzf "$tarball" | grep -qx 'package/lib/create.mjs'
          tar -tzf "$tarball" | grep -qx 'package/lib/configure.mjs'
          tar -tzf "$tarball" | grep -qx 'package/lib/registry.mjs'
          tar -tzf "$tarball" | grep -qx 'package/templates/prettierignore'
          tar -tzf "$tarball" | grep -qx 'package/versions.json'
          if tar -tzf "$tarball" | grep -q 'package/overlays/'; then
            echo 'theme overlays must not be published'
            exit 1
          fi
          if tar -tzf "$tarball" | grep -q 'package/recipes/'; then
            echo 'recipes must not be published; use lib/registry.mjs'
            exit 1
          fi
