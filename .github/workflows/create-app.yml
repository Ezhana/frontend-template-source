name: Create app matrix

on:
  workflow_dispatch:

  push:
    paths:
      - 'tools/create-app/**'
      - 'template/**'
      - 'scripts/export-template.mjs'
      - 'packages/**'
      - 'pnpm-workspace.yaml'

  pull_request:
    paths:
      - 'tools/create-app/**'
      - 'template/**'
      - 'scripts/export-template.mjs'
      - 'packages/**'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: create-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create:
    name: Create ${{ matrix.template }} app
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        template: [react, vue]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24.21.0
          cache: true
          require-lockfile: true

      - name: Generate app
        run: pnpm create:app ${{ matrix.template }} generated-app --target "$RUNNER_TEMP/generated-app"

      - name: Check generated files
        run: |
          test -f "$RUNNER_TEMP/generated-app/eslint.config.mjs"
          test -f "$RUNNER_TEMP/generated-app/prettier.config.mjs"
          test -f "$RUNNER_TEMP/generated-app/src/theme/useTheme.ts"
          test ! -f "$RUNNER_TEMP/generated-app/.oxlintrc.json"

      - name: Pack generator
        run: |
          pnpm --dir tools/create-app pack --pack-destination "$RUNNER_TEMP"
          tarball=$(ls "$RUNNER_TEMP"/create-ezhana-app-*.tgz)
          tar -tzf "$tarball" | grep -qx 'package/bin/create-app.mjs'
          tar -tzf "$tarball" | grep -qx 'package/overlays/react/src/ThemeRoot.tsx'
          tar -tzf "$tarball" | grep -qx 'package/overlays/vue/src/ThemeRoot.vue'
          tar -tzf "$tarball" | grep -qx 'package/recipes/index.mjs'
          tar -tzf "$tarball" | grep -qx 'package/snippets/theme-init.html'
          tar -tzf "$tarball" | grep -qx 'package/versions.json'
