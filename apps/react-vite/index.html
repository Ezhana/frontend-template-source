<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react-vite</title>
    <!-- Apply the stored theme before first paint to avoid a flash of the wrong theme. -->
    <script>
      ;(function () {
        var root = document.documentElement
        var stored = null
        try {
          stored = JSON.parse(localStorage.getItem('ezhana-theme') || 'null')
        } catch (error) {
          stored = null
        }
        root.setAttribute(
          'data-theme',
          (stored && typeof stored.theme === 'string' && stored.theme) || 'default',
        )
        if (stored && (stored.mode === 'light' || stored.mode === 'dark')) {
          root.setAttribute('data-color-mode', stored.mode)
        } else {
          root.removeAttribute('data-color-mode')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
