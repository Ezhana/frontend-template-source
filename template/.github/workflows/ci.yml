name: CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24.21.0
          cache: true
          require-lockfile: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Exercises the published create-ezhana-app package pinned in devDependencies: tarball
      # contents, bin resolution, official scaffolders, overlay and package.json patching.
      # Uses the default apps/<name> target so the workspace's pinned pnpm version is used.
      - name: Smoke-test create:app
        run: |
          pnpm create:app react smoke-react --no-install
          pnpm create:app vue smoke-vue --no-install
