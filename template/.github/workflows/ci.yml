name: CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24.21.0
          cache: true
          require-lockfile: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  # Exercises the published create-ezhana-app package pinned in devDependencies: official
  # scaffolders, theme overlay (and the --no-theme escape hatch), the opt-in config writer and the
  # configure subcommand.
  #
  # One app is generated per job on purpose. The generator adds apps/<name> to the workspace; a
  # second `pnpm create:app` in the same job would make pnpm verify the (now stale) lockfile before
  # running and fail on the new importer. A matrix also keeps the failure attributable to a template.
  create-app:
    name: ${{ matrix.mode }} ${{ matrix.template }} app
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - template: react
            mode: default
          - template: vue
            mode: default
          - template: react
            mode: configured
          - template: vue
            mode: configured
          - template: react
            mode: configure-command
          - template: react
            mode: no-theme
          - template: vue
            mode: no-theme

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24.21.0
          cache: true
          require-lockfile: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create ${{ matrix.template }} app
        run: |
          if [ "${{ matrix.mode }}" = "configured" ]; then
            pnpm create:app ${{ matrix.template }} generated-app --no-install --eslint --prettier
          elif [ "${{ matrix.mode }}" = "no-theme" ]; then
            pnpm create:app ${{ matrix.template }} generated-app --no-install --no-theme
          else
            pnpm create:app ${{ matrix.template }} generated-app --no-install
          fi

      # Run the installed bin directly. A second pnpm script invocation would make pnpm validate the
      # lockfile after apps/generated-app was added as an importer, and fail on the frozen lockfile.
      - name: Write configs through configure
        if: matrix.mode == 'configure-command'
        run: node node_modules/create-ezhana-app/bin/create-app.mjs configure apps/generated-app --eslint --prettier --no-install

      - name: Check default generated files
        if: matrix.mode == 'default'
        run: |
          test -f apps/generated-app/src/theme/registry.ts
          test -f apps/generated-app/src/theme/useTheme.ts
          test ! -f apps/generated-app/eslint.config.mjs
          test ! -f apps/generated-app/prettier.config.mjs
          if [ "${{ matrix.template }}" = "react" ]; then
            test -f apps/generated-app/.oxlintrc.json
          fi

      - name: Check configured generated files
        if: matrix.mode == 'configured' || matrix.mode == 'configure-command'
        run: |
          test -f apps/generated-app/eslint.config.mjs
          test -f apps/generated-app/prettier.config.mjs
          test -f apps/generated-app/.prettierignore
          test -f apps/generated-app/src/theme/registry.ts
          test -f apps/generated-app/src/theme/useTheme.ts
          grep -q "@ezhana/eslint-config-${{ matrix.template }}" apps/generated-app/eslint.config.mjs
          grep -q '@ezhana/prettier-config' apps/generated-app/prettier.config.mjs

      # Escape hatch: the app is the plain official scaffold.
      - name: Check no-theme generated files
        if: matrix.mode == 'no-theme'
        run: |
          test ! -e apps/generated-app/src/theme
          if grep -q 'ezhana-theme' apps/generated-app/index.html; then
            echo 'index.html still contains the theme init script'
            exit 1
          fi
